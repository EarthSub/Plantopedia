{% extends 'base.html' %}
{% block title %}
    Delete {{ plant.name }} | Plantopedia
{% endblock %}
{% block content %}
    <section class="confirm-card">
        <div class="large-symbol">🍂</div>
        <p class="eyebrow">CONFIRM DELETE</p>
        <h1>Delete {{ plant.name }}?</h1>
        <p>This will permanently remove the plant and its care notes. This action cannot be undone.</p>
        <form method="post">
            {% csrf_token %}
            <button class="button button-danger" type="submit">Delete plant</button>
            <a class="button button-quiet" href="{% url 'plant_detail' plant.pk %}">Cancel</a>
        </form>
    </section>
{% endblock %}
